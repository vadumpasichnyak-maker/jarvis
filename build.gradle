plugins {
    id 'com.android.application' version '8.2.0'
    id 'org.jetbrains.kotlin.android' version '1.9.20'
}

android {
    namespace 'com.example.jarvis'
    compileSdk 34

    signingConfigs {
        debug {
            storeFile file('jarvis.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'com.example.jarvis'
        minSdk 31
        targetSdk 34
        versionCode 2
        versionName '2.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['app/src/main/java', 'src/main/java']
            res.srcDirs = ['app/src/main/res', 'src/main/res']
        }
    }
}

dependencies {
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}

preBuild.doFirst {
    def targetDir = new File(projectDir, 'src/main/res/xml')
    targetDir.mkdirs()
    def sourceFile = new File(projectDir, 'accessibility_config.xml')
    if (sourceFile.exists()) {
        new File(targetDir, 'accessibility_config.xml').bytes = sourceFile.bytes
    }
}
tasks.register("syncStringsXml") {
    doLast {
        def targetDir = file("src/main/res/values")
        targetDir.mkdirs()

        def sourceFile = file("strings.xml").exists()
                ? file("strings.xml")
                : file("jarvis_strings.xml")

        if (sourceFile.exists()) {
            copy {
                from sourceFile
                into targetDir
                rename { "strings.xml" }
            }
        }
    }
}

tasks.named("preBuild") {
    dependsOn("syncStringsXml")
}
